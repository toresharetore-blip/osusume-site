# サイトの稼働監視(15分ごと)。結果は uptime ブランチの uptime.csv に追記する
# (main には書かないので、サイトの公開・デプロイは発生しない)
name: uptime
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check pages
        id: chk
        run: |
          BASE=https://osusume-site.toresharetore.workers.dev
          ok=1; codes=""; slow=0
          for p in "" sitemap.xml bonyujikkan-nipple-size lakumug-hajimete-morenai-chigai; do
            r=$(curl -s -o /tmp/body -w "%{http_code} %{time_total}" --max-time 20 "$BASE/$p" || echo "000 20")
            c=${r% *}; t=${r#* }
            codes="$codes $c"
            ms=$(awk -v t="$t" 'BEGIN{printf "%d", t*1000}')
            [ "$ms" -gt "$slow" ] && slow=$ms
            [ "$c" != "200" ] && ok=0
            if [ -z "$p" ] && ! grep -q "くらべてえらぶ" /tmp/body; then ok=0; codes="$codes(body?)"; fi
          done
          echo "line=$(date -u +%Y-%m-%dT%H:%MZ),$ok,${codes# },$slow" >> "$GITHUB_OUTPUT"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - name: Record
        env:
          LINE: ${{ steps.chk.outputs.line }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q log && cd log
          git config user.name "uptime-bot"
          git config user.email "uptime-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin uptime; then
            git checkout -q -b uptime FETCH_HEAD
          else
            git checkout -q --orphan uptime
            echo "time_utc,ok,status_codes,slowest_ms" > uptime.csv
          fi
          echo "$LINE" >> uptime.csv
          git add uptime.csv
          git commit -q -m "uptime $LINE"
          for i in 1 2 3; do
            git push -q origin uptime && break
            git fetch -q --depth 1 origin uptime && git rebase -q FETCH_HEAD || true
          done
      - name: Fail if down
        if: steps.chk.outputs.ok != '1'
        run: |
          echo "::error::サイトが正常に応答していません: ${{ steps.chk.outputs.line }}"
          exit 1
